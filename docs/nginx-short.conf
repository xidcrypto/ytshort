# Shorts Studio — reverse proxy ke Next.js (PM2, port 3001).
# Domain: short.hgitopup.web.id
# App tetangga pansa-gateway (hgitopup.web.id → 127.0.0.1:3000) TIDAK diubah.
#
# Cara pakai (di VPS):
#   sudo cp docs/nginx-short.conf /etc/nginx/sites-available/shorts-studio
#   sudo ln -sf /etc/nginx/sites-available/shorts-studio /etc/nginx/sites-enabled/shorts-studio
#   sudo certbot --nginx -d short.hgitopup.web.id   # terbitkan TLS + redirect HTTP→HTTPS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Catatan:
# - App WAJIB bind 127.0.0.1:3001 (lihat package.json "start").
# - client_max_body_size 250m: upload MP4 maks 200MB + margin header.
# - Blok listen 443 + ssl_certificate di bawah diisi otomatis oleh certbot
#   (--nginx). Jangan tulis manual sebelum cert terbit.

upstream shorts_studio {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    server_name short.hgitopup.web.id;

    # ACME challenge untuk certbot (jangan di-proxy).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # SSE realtime (/api/agent/events): matikan buffering agar event
    # mengalir langsung, bukan ditahan nginx.
    location = /api/agent/events {
        proxy_pass http://shorts_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://shorts_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        client_max_body_size 250m;
    }

    listen 80;
    listen [::]:80;
}
